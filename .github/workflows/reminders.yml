name: Send reminders and deadline alerts
on:
  schedule:
    # 02:00 UTC = 08:00 Bangladesh; 07:00 and 08:00 UTC = 08:00 UK in summer (BST) and winter (GMT);
    # 12:00 and 17:00 UTC give every other time zone a daytime run. Users only get messages 08:00-21:00 local.
    - cron: "0 2,7,8,12,17 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: reminders
  cancel-in-progress: false
jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run reminders
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.APP_URL || 'https://jobpao.app' }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      - name: Tell the owner it failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One open issue per problem: a job that keeps failing does not open a new issue every run.
          t="Reminder emails failed"
          if [ "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$t\"" --json number --jq length)" = "0" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$t" --body "See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

name: Ingest public job listings
on:
  push:
    branches: [main]
    paths: ['scripts/ingest/bd/**']
  schedule:
    - cron: "10 * * * *"   # hourly; each run scans only the markets whose local update is due in 2 hours (src/lib/scan-schedule.ts)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (fetch and print, write nothing)"
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Free OCR for image circulars (Bangla + English); AI reads only what this cannot confirm.
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-ben
      - run: npm run ingest -- ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BD_CIRCULAR_AI_LIMIT: ${{ vars.BD_CIRCULAR_AI_LIMIT || 200 }}
          BD_CIRCULAR_AI_BUDGET_USD: ${{ vars.BD_CIRCULAR_AI_BUDGET_USD || 0.5 }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.APP_URL || 'https://jobpao.app' }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      - name: Tell the owner it failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One open issue per problem: an hourly job that keeps failing does not open a new issue every hour.
          t="Job ingest failed"
          if [ "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$t\"" --json number --jq length)" = "0" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$t" --body "See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

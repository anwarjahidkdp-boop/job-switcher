name: Deploy
# Builds the app with OpenNext and deploys it to Cloudflare Workers after CI passes on main (never on a red build).
# Needs the repository secret CLOUDFLARE_API_TOKEN (Cloudflare template "Edit Cloudflare Workers").
# Worker settings are copied from repository secrets when they are set, so they never live in this public repo.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: deploy-app
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the repository secret CLOUDFLARE_API_TOKEN to deploy."; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          # The exact commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Public values come from .env.production; APP_URL overrides the app address once it is known.
      - run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.APP_URL || 'https://jobpao.app' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      - name: Copy Worker settings from repository secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          BKASH_MANUAL_NUMBER: ${{ secrets.BKASH_MANUAL_NUMBER }}
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
          LEMONSQUEEZY_STORE_ID: ${{ secrets.LEMONSQUEEZY_STORE_ID }}
          LEMONSQUEEZY_VARIANT_ID: ${{ secrets.LEMONSQUEEZY_VARIANT_ID }}
          LEMONSQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMONSQUEEZY_WEBHOOK_SECRET }}
          INBOUND_SHARED_SECRET: ${{ secrets.INBOUND_SHARED_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_TOKEN_KEY: ${{ secrets.GMAIL_TOKEN_KEY }}
        run: |
          set -e
          json="{}"
          for name in SUPABASE_SERVICE_ROLE_KEY ANTHROPIC_API_KEY ADMIN_EMAILS BKASH_MANUAL_NUMBER INBOUND_SHARED_SECRET CRON_SECRET RESEND_API_KEY BREVO_API_KEY EMAIL_PROVIDER EMAIL_FROM GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GMAIL_TOKEN_KEY LEMONSQUEEZY_API_KEY LEMONSQUEEZY_STORE_ID LEMONSQUEEZY_VARIANT_ID LEMONSQUEEZY_WEBHOOK_SECRET; do
            value="${!name}"
            if [ -n "$value" ]; then json=$(jq -c --arg k "$name" --arg v "$value" '. + {($k): $v}' <<<"$json"); fi
          done
          if [ "$json" != "{}" ]; then
            printf '%s' "$json" > "$RUNNER_TEMP/worker-secrets.json"
            npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json"
            rm -f "$RUNNER_TEMP/worker-secrets.json"
          fi
      # Settings first, so the new code never starts with old settings. Roll back a bad release with: npx wrangler rollback
      - run: npx wrangler deploy
      - name: Verify production health
        env:
          APP_ORIGIN: ${{ secrets.APP_URL || 'https://jobpao.app' }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 "$APP_ORIGIN/api/health" | jq -e '.ok == true'
      - name: Tell the owner it failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One open issue per problem: an hourly job that keeps failing does not open a new issue every hour.
          t="Deploy to jobpao.app failed"
          if [ "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$t\"" --json number --jq length)" = "0" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$t" --body "See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

name: Refresh UK visa sponsor register
on:
  schedule:
    - cron: "30 3 * * 1"    # weekly, Monday morning UK time
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sponsors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sponsors
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
